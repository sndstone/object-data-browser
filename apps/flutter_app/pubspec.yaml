name: s3_browser_crossplat
description: Cross-platform object data browser with pluggable backend engines.
publish_to: "none"
# GitHub Releases are published from this version value.
version: 2.3.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  desktop_drop: ^0.6.0
  file_picker: ^8.0.0+1
  flutter_secure_storage: ^10.3.1
  flutter_widget_from_html_core: ^0.17.2
  google_fonts: ^6.2.1
  highlight: ^0.7.0
  path_provider: ^2.1.4
  share_plus: ^12.0.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Sora-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
