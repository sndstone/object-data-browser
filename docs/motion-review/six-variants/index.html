<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans)}
section{margin-bottom:28px}h3{font-size:inherit;font-weight:500;margin:0}
.heading{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.author,.description,.sequence{color:var(--muted-foreground)}
.description{margin:6px 0 10px}.sequence{margin:0 0 18px}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--border);border-radius:var(--radius);color:var(--foreground);background:var(--secondary);padding:8px 12px;min-height:40px}
button:focus-visible{outline:2px solid var(--ring)}button:disabled{opacity:.55}
canvas{display:block;width:100%;max-width:560px;aspect-ratio:464/240;margin:auto;border-radius:var(--radius)}
.time{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
</style></head><body><p class="sequence">Each Play runs Details → Preview → Details at normal speed.</p><main id="variants"></main><script>
const designs=[{"id":"sol-edge-reveal","title":"Edge reveal","durationMs":260,"description":"The next view uncovers the current one; both stay sharp and stationary.","mechanism":{"type":"edgeReveal","easing":"cubic-bezier(0.65,0,0.35,1)","timeline":"Let p run from 0 to 1 over 260 ms. Forward navigation: incoming opaque image is clipped to x=(1-p)*W through W; outgoing opaque image is clipped to x=0 through (1-p)*W. Reverse navigation mirrors both clips. Opacity remains 1 and translation remains zero throughout. The two rectangles meet exactly, so no text overlaps and no background gap opens.","direction":"Forward uncovers from the right edge toward the left; back uncovers from the left edge toward the right.","notes":"Keep the viewport and tabs fixed. At rest, remove the outgoing layer. For rapid reversal, preserve the current seam coordinate and animate it back rather than restarting at an edge."},"author":"GPT‑6.1 Sol"},{"id":"sol-clipped-push","title":"Clipped push","durationMs":300,"description":"The next view pushes the previous one aside as one continuous surface.","mechanism":{"type":"clippedPush","easing":"cubic-bezier(0.65,0,0.35,1)","timeline":"Let p run from 0 to 1 over 300 ms. Inside one overflow-hidden viewport, outgoing image translates from x=0 to x=-W*p while incoming image translates from x=W to x=W*(1-p). Images remain opaque and equal-size, touching at the shared boundary. Reverse navigation mirrors both transforms. Do not scale or fade either layer.","direction":"Forward pushes left; back pushes right.","notes":"This is intentionally more spatial than Edge reveal, so the user can judge whether visible travel helps. No overshoot or trailing shadow. Preserve the current translation on interrupted reversal."},"author":"GPT‑6.1 Sol"},{"id":"sol-quiet-replace","title":"Quiet replace","durationMs":160,"description":"A brief, stationary replacement with no lateral travel or overlapping text.","mechanism":{"type":"quietReplace","easing":"ease-in-out sine for each phase","timeline":"0-60 ms: outgoing image opacity goes from 1 to 0, incoming remains at 0. At 60 ms: outgoing is removed and incoming begins immediately, with no blank hold. 60-160 ms: incoming opacity goes from 0 to 1. Both images stay at x=0, y=0; the stable viewport background remains visible beneath them. Do not crossfade the text layers.","direction":"No directional movement; same behavior in both directions.","notes":"The deliberately short 160 ms duration distinguishes this from the rejected slow fade-through. Keep it a one-shot replacement and avoid an initial empty frame."},"author":"GPT‑6.1 Sol"},{"id":"opus-row-cascade","title":"Row cascade","durationMs":256,"author":"Opus 5.5","description":"Rows change in a quick top-to-bottom sequence."},{"id":"opus-center-split","title":"Center split reveal","durationMs":240,"author":"Opus 5.5","description":"The new view opens from the center toward both edges."},{"id":"opus-diagonal-sweep","title":"Feathered diagonal sweep","durationMs":280,"author":"Opus 5.5","description":"A narrow, soft diagonal edge uncovers the next view."}];

const clamp=x=>Math.max(0,Math.min(1,x));
function bezier(x,x1,y1,x2,y2){
 const coord=(t,a,b)=>3*(1-t)*(1-t)*t*a+3*(1-t)*t*t*b+t*t*t;
 let low=0,high=1,t=.5;for(let i=0;i<18;i++){t=(low+high)/2;if(coord(t,x1,x2)<x)low=t;else high=t;}
 return coord(t,y1,y2);
}
const smooth=p=>bezier(clamp(p),.65,0,.35,1);
const sine=p=>.5-.5*Math.cos(Math.PI*clamp(p));
function load(src){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src;});}
Promise.all([load(imageSources.details),load(imageSources.preview)]).then(([details,preview])=>{
 for(const design of designs){
  const section=document.createElement('section');section.dataset.variant=design.id;
  section.innerHTML=`<div class="heading"><h3>${design.title}</h3><span class="author">${design.author}</span></div><p class="description">${design.description}</p><div class="controls"><button type="button" class="play" aria-label="Play ${design.title}">Play</button><button type="button" class="reset" aria-label="Reset ${design.title}">Reset</button><span class="time">${design.durationMs} ms</span></div><canvas width="928" height="480" role="img" aria-label="${design.title}: content transition from object details to source preview"></canvas>`;
  document.getElementById('variants').appendChild(section);
  const canvas=section.querySelector('canvas'),ctx=canvas.getContext('2d');
  const play=section.querySelector('.play');const W=464,H=240;
  const layer=document.createElement('canvas');layer.width=928;layer.height=480;const lc=layer.getContext('2d');
  let request=0,generation=0;
  function image(image,alpha=1,x=0,y=0){ctx.save();ctx.globalAlpha=clamp(alpha);ctx.drawImage(image,x,y,W,H);ctx.restore();}
  function clipped(imageToDraw,left,top,width,height,alpha=1,x=0,y=0){
   if(width<=0||height<=0||alpha<=0)return;
   ctx.save();ctx.beginPath();ctx.rect(left,top,width,height);ctx.clip();image(imageToDraw,alpha,x,y);ctx.restore();
  }
  function render(progress,forward=true){
   const p=clamp(progress),a=forward?details:preview,b=forward?preview:details,direction=forward?1:-1;
   ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#f7f8fa';ctx.fillRect(0,0,W,H);
   if(p<=0){image(a);return;}if(p>=1){image(b);return;}
   const v=smooth(p),id=design.id;
   if(id==='sol-edge-reveal'){
    const seam=forward?W*(1-v):W*v;
    if(forward){clipped(a,0,0,seam,H);clipped(b,seam,0,W-seam,H);}
    else{clipped(a,seam,0,W-seam,H);clipped(b,0,0,seam,H);}
   }else if(id==='sol-clipped-push'){
    image(a,1,-direction*W*v);image(b,1,direction*W*(1-v));
   }else if(id==='sol-quiet-replace'){
    const ms=p*160;if(ms<60)image(a,1-sine(ms/60));else image(b,sine((ms-60)/100));
   }else if(id==='opus-row-cascade'){
    for(let i=0;i<8;i++){
     const band=H/8,local=p*256-i*8;
     if(local<=0)clipped(a,0,i*band,W,band);
     else if(local<80)clipped(a,0,i*band,W,band,1-bezier(local/80,.4,0,1,1));
     else{const t=clamp((local-80)/120),e=bezier(t,0,0,.2,1);clipped(b,0,i*band,W,band,e,0,4*(1-e));}
    }
   }else if(id==='opus-center-split'){
    const e=bezier(p,.2,0,0,1),left=W*(1-e)/2,right=W-left;
    // Complementary clips keep the intended single-image-per-pixel result.
    clipped(a,0,0,left,H,1-.15*p);clipped(a,right,0,W-right,H,1-.15*p);
    clipped(b,left,0,right-left,H,.6+.4*clamp(p*2));
   }else if(id==='opus-diagonal-sweep'){
    image(a);const e=bezier(p,.3,0,.1,1),diagonal=(W+H)/Math.SQRT2,front=-32+(diagonal+64)*e;
    lc.setTransform(2,0,0,2,0,0);lc.clearRect(0,0,W,H);lc.globalCompositeOperation='source-over';lc.drawImage(b,0,0,W,H);
    const start=(front-32)/Math.SQRT2,end=front/Math.SQRT2;
    const mask=lc.createLinearGradient(start,start,end,end);mask.addColorStop(0,'rgba(0,0,0,1)');mask.addColorStop(1,'rgba(0,0,0,0)');
    lc.globalCompositeOperation='destination-in';lc.fillStyle=mask;lc.fillRect(0,0,W,H);lc.globalCompositeOperation='source-over';
    ctx.drawImage(layer,0,0,W,H);
   }
  }
  function reset(){generation++;cancelAnimationFrame(request);play.disabled=false;play.textContent='Play';render(0);}
  play.addEventListener('click',()=>{
   generation++;const run=generation;cancelAnimationFrame(request);play.disabled=true;play.textContent='Playing…';
   const duration=design.durationMs,hold=650,start=performance.now();
   function tick(now){
    if(run!==generation)return;const elapsed=now-start;
    if(elapsed<duration)render(elapsed/duration,true);
    else if(elapsed<duration+hold)render(1,true);
    else if(elapsed<2*duration+hold)render((elapsed-duration-hold)/duration,false);
    else{render(1,false);play.disabled=false;play.textContent='Play';return;}
    request=requestAnimationFrame(tick);
   }
   request=requestAnimationFrame(tick);
  });
  section.querySelector('.reset').addEventListener('click',reset);
  // Expose deterministic frame sampling for checking the visual study.
  canvas.motionStudy={render,design};render(0);
 }
 window.motionStudiesReady=true;
}).catch(error=>{document.getElementById('variants').textContent='Could not load comparison images.';console.error(error);});
