const root=document.getElementById('players');
for(const model of players){
 const section=document.createElement('section');section.className=model.id;
 section.innerHTML=`<h3>${model.title}</h3><div class="controls"><button type="button" class="play" aria-label="Play ${model.title}">Play</button><button type="button" class="stop" aria-label="Stop ${model.title}">Stop</button><label for="speed-${model.id}">Speed</label><select id="speed-${model.id}"><option value="1">Full · 1×</option><option value="0.5">Half · ½×</option><option value="0.25" selected>Quarter · ¼×</option><option value="0.125">Eighth · ⅛×</option></select>${model.note?`<span class="note">${model.note}</span>`:''}</div><img alt="${model.title}">`;
 root.appendChild(section);
 const image=section.querySelector('img'),speed=section.querySelector('select'),play=section.querySelector('.play');
 const original=Uint8Array.from(atob(model.source),c=>c.charCodeAt(0));
 let timer;image.src=model.still;
 const stop=()=>{clearTimeout(timer);image.src=model.still;play.textContent='Play';};
 function start(){
  clearTimeout(timer);const bytes=original.slice(),rate=Number(speed.value);let total=0;
  for(const offset of model.delays){const delay=Math.round((original[offset]+256*original[offset+1])/rate);bytes[offset]=delay&255;bytes[offset+1]=delay>>8;total+=delay;}
  let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  image.removeAttribute('src');image.src='data:image/gif;base64,'+btoa(binary);play.textContent='Replay';
  timer=setTimeout(()=>{play.textContent='Play';},total*10);
 }
 play.addEventListener('click',start);section.querySelector('.stop').addEventListener('click',stop);speed.addEventListener('change',stop);
}
