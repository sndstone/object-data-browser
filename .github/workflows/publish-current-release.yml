name: Publish Current Release

on:
  push:
    branches:
      - main
    paths:
      - apps/flutter_app/pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verification.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' apps/flutter_app/pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "Unable to read version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## / {
              if (found) {
                exit
              }
              if ($2 == version) {
                found = 1
                next
              }
            }
            found {
              print
            }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s.\n' "$VERSION" > release-notes.md
          fi
      - name: Create draft release pending package verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; leaving published notes and assets unchanged."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Version $VERSION" \
              --notes-file release-notes.md \
              --draft
          fi
