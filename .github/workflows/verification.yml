name: Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Validate workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck="" -pyflakes=""
      - name: Validate shell scripts
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -name '*.sh' -print0)
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    needs: preflight
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - run: flutter pub get
        working-directory: apps/flutter_app
      - run: flutter analyze
        working-directory: apps/flutter_app
      - run: flutter test
        working-directory: apps/flutter_app
  engines:
    needs: preflight
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [python, go, rust, java]
    env:
      REQUIRE_ENGINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest boto3
      - uses: actions/setup-go@v5
        if: matrix.engine == 'go'
        with:
          go-version-file: engines/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.engine == 'rust'
      - uses: actions/setup-java@v4
        if: matrix.engine == 'java'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build required engine
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.engine }}' in
            python) echo 'ENGINE_CMD=python engines/python/src/main.py' >> "$GITHUB_ENV" ;;
            go) (cd engines/go && go build -o ../../engine-test ./src); echo 'ENGINE_CMD=./engine-test' >> "$GITHUB_ENV" ;;
            rust) cargo build --manifest-path engines/rust/Cargo.toml; echo 'ENGINE_CMD=engines/rust/target/debug/s3-browser-rust-engine' >> "$GITHUB_ENV" ;;
            java) bash apps/flutter_app/android/gradlew -p engines/java installDist --no-daemon; echo 'ENGINE_CMD=engines/java/build/install/s3-browser-java-engine/bin/s3-browser-java-engine' >> "$GITHUB_ENV" ;;
          esac
      - run: python -m pytest tests/contract -q

  download-filesystems:
    needs: preflight
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_ENGINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest boto3
      - run: python -m pytest tests/contract/test_download_safety.py -q
